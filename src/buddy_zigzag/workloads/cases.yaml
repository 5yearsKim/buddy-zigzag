# All expected values are independent of the MLIR extractor.
matmul_rect:
  kind: matmul
  shapes: [[64, 32], [32, 128]]
  dtype: float32
  seed: 0
  expected_macs: [262144]
  expected_loops: [{M: 64, N: 128, K: 32}]

matmul_small:
  kind: matmul
  shapes: [[3, 5], [5, 7]]
  dtype: float32
  seed: 1
  expected_macs: [105]
  expected_loops: [{M: 3, N: 7, K: 5}]

matmul_unit:
  kind: matmul
  shapes: [[1, 1], [1, 1]]
  dtype: float32
  seed: 2
  expected_macs: [1]
  expected_loops: [{M: 1, N: 1, K: 1}]

batch_matmul:
  kind: batch_matmul
  shapes: [[2, 3, 5], [2, 5, 7]]
  dtype: float32
  seed: 3
  expected_macs: [210]
  expected_loops: [{B: 2, M: 3, N: 7, K: 5}]

matmul_chain:
  kind: matmul_chain
  shapes: [[3, 5], [5, 7], [7, 4]]
  dtype: float32
  seed: 4
  expected_macs: [105, 84]
  expected_loops: [{M: 3, N: 7, K: 5}, {M: 3, N: 4, K: 7}]
